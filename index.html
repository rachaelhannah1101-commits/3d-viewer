<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Viewer</title>

  <!-- Correct model-viewer script -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #f5f5f5;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background-color: #f5f5f5;
    }
  </style>
</head>

<body>

  <model-viewer
    id="viewer"
    src="https://raw.githubusercontent.com/rachaelhannah1101-commits/3d-viewer/main/wall_40w_40h_3s_br.glb"
    camera-controls
    auto-rotate
    shadow-intensity="1">
  </model-viewer>

<script>
  const BASE_URL = "https://raw.githubusercontent.com/rachaelhannah1101-commits/3d-viewer/main/";
  const viewer = document.getElementById("viewer");

  function changeModel(file) {
    viewer.src = BASE_URL + file;

    // Wait for new model to load
    viewer.addEventListener("load", () => {
      startAutoRotate();
    }, { once: true });
  }

  function startAutoRotate() {
    viewer.setAttribute("auto-rotate", "");
  }

  function stopAutoRotate() {
    viewer.removeAttribute("auto-rotate");
  }

  // Stop rotating when user interacts
  viewer.addEventListener("camera-change", () => {
    stopAutoRotate();
  });
</script>

  
</body>
</html>
