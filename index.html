<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Viewer</title>

  <!-- Correct model-viewer script -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #f5f5f5;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background-color: #f5f5f5;
    }
  </style>
</head>

<body>

  <model-viewer
    id="viewer"
    src="https://raw.githubusercontent.com/rachaelhannah1101-commits/3d-viewer/main/wall_40w_40h_3s_br.glb"
    camera-controls
    auto-rotate
    shadow-intensity="1">
  </model-viewer>

<script>
  const BASE_URL = "https://raw.githubusercontent.com/rachaelhannah1101-commits/3d-viewer/main/";

  const params = new URLSearchParams(window.location.search);
  const model = params.get("model");

  if (model) {
    document.getElementById("viewer").src = BASE_URL + model;
  }

  function changeModel(file){
    document.getElementById("viewer").src = BASE_URL + file;
  }
</script>
  
</body>
</html>
