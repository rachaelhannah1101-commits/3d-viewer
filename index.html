<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Viewer</title>

  <!-- ✅ Model Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    /* ✅ Remove all scroll + ensure full fit */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      background: #f5f5f5;
    }

    /* ✅ Force viewer to fully fill iframe (no overflow) */
    model-viewer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: hidden;
      background-color: #f5f5f5;
    }
  </style>
</head>

<body>

<model-viewer
  id="viewer"
  camera-controls
  shadow-intensity="1"
  exposure="1"
  ar
></model-viewer>

<script>
  // ✅ Base GitHub model path
  const BASE_URL = "https://raw.githubusercontent.com/rachaelhannah1101-commits/3d-viewer/main/";
  const viewer = document.getElementById("viewer");

  // ✅ Track real user interaction
  let userInteracted = false;

  // ✅ Load model from URL (Webflow uses this)
  function loadFromURL() {
    const params = new URLSearchParams(window.location.search);
    const model = params.get("model");

    if (model) {
      viewer.src = BASE_URL + model;
    } else {
      // ✅ Default model
      viewer.src = BASE_URL + "wall_40w_40h_3s_br.glb";
    }
  }

  // ✅ Load model immediately
  loadFromURL();

  // ✅ Start auto-rotation AFTER model loads
  viewer.addEventListener("load", () => {
    userInteracted = false;
    viewer.setAttribute("auto-rotate", "");
  });

  // ✅ Detect real user interaction
  viewer.addEventListener("pointerdown", () => {
    userInteracted = true;
  });

  // ✅ Stop rotating ONLY after user interacts
  viewer.addEventListener("camera-change", () => {
    if (userInteracted) {
      viewer.removeAttribute("auto-rotate");
    }
  });

  // ✅ Optional manual model change (not used by Webflow but safe to keep)
  function changeModel(file) {
    viewer.src = BASE_URL + file;
  }

</script>

</body>
</html>
