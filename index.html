<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Viewer</title>

  <!-- Model Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* ✅ Removes scrollbars */
      background: #f5f5f5;
    }

    model-viewer {
      width: 100%;
      height: 100%; /* ✅ Fill iframe instead of viewport */
      display: block;
      background-color: #f5f5f5;
    }
  </style>
</head>

<body>

<model-viewer
  id="viewer"
  camera-controls
  shadow-intensity="1"
  exposure="1"
  ar
></model-viewer>

<script>
  // ✅ Base GitHub file location
  const BASE_URL = "https://raw.githubusercontent.com/rachaelhannah1101-commits/3d-viewer/main/";
  const viewer = document.getElementById("viewer");

  // ✅ Load model from URL parameter (THIS is what Webflow uses)
  function loadFromURL() {
    const params = new URLSearchParams(window.location.search);
    const model = params.get("model");

    if (model) {
      viewer.src = BASE_URL + model;
    } else {
      // ✅ Default model
      viewer.src = BASE_URL + "wall_40w_40h_3s_br.glb";
    }
  }

  // ✅ Run when page loads
  loadFromURL();

  // ✅ Rotate once when model loads
  viewer.addEventListener("load", () => {
    viewer.setAttribute("auto-rotate", "");
  });

  // ✅ Stop rotation when user interacts
  viewer.addEventListener("camera-change", () => {
    viewer.removeAttribute("auto-rotate");
  });

  // ✅ Optional: keep manual switching function (not used by Webflow currently)
  function changeModel(file) {
    viewer.src = BASE_URL + file;
  }

</script>

</body>
</html>
